<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" fill="none" role="img" aria-labelledby="vtitle vdesc">
  <title id="vtitle">Ilustración botánica de Venus atrapamoscas</title>
  <desc id="vdesc">Trampa abierta de Dionaea muscipula con bordes dentados verdes, interior carmesí y pelos sensitivos.</desc>
  <defs>
    <linearGradient id="v-leaf" x1="20" y1="190" x2="180" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35A94E" />
      <stop offset="1" stop-color="#B7F43E" />
    </linearGradient>
    <radialGradient id="v-nectar" cx="50%" cy="55%" r="55%">
      <stop stop-color="#8F1D2C" />
      <stop offset=".55" stop-color="#DC3D34" />
      <stop offset="1" stop-color="#A8E635" />
    </radialGradient>
  </defs>
  <!-- Pecíolo -->
  <path d="M24 202c32-24 62-44 92-64 11-7 22-8 31-2-18 22-48 45-91 72-12 7-26 3-32-6Z" fill="url(#v-leaf)" stroke="#D8FF88" stroke-opacity=".55" stroke-width="2" />
  <path d="M36 198c29-20 62-41 96-60" stroke="#E5FFA8" stroke-opacity=".6" stroke-width="2" stroke-linecap="round" />
  <!-- Lóbulo posterior -->
  <path d="M98 118c-8-46 25-84 74-86 33-1 58 20 64 49-20 34-70 59-138 37Z" fill="url(#v-nectar)" stroke="#B7F43E" stroke-width="4" />
  <!-- Dientes superiores (cilios) -->
  <g stroke="#C6F954" stroke-width="3.2" stroke-linecap="round">
    <path d="M104 82 88 64" />
    <path d="M118 62 106 40" />
    <path d="M137 47 130 23" />
    <path d="M159 38 158 14" />
    <path d="M182 37 188 14" />
    <path d="M204 45 216 25" />
    <path d="M222 60 239 46" />
  </g>
  <!-- Lóbulo frontal -->
  <path d="M97 122c18 35 66 53 111 33 25-11 38-34 30-62-29 28-88 45-141 29Z" fill="url(#v-leaf)" stroke="#D8FF88" stroke-opacity=".75" stroke-width="3" />
  <!-- Dientes frontales -->
  <g stroke="#B7F43E" stroke-width="3" stroke-linecap="round">
    <path d="M120 144 108 164" />
    <path d="M144 157 137 180" />
    <path d="M170 161 169 185" />
    <path d="M196 156 202 179" />
    <path d="M219 143 231 163" />
    <path d="M234 121 251 134" />
  </g>
  <!-- Pelos sensitivos internos (tricomas) -->
  <g stroke="#FFE599" stroke-width="2" stroke-linecap="round">
    <path d="M152 94 148 80" />
    <path d="M176 88 176 74" />
    <path d="M196 98 202 85" />
  </g>
  <!-- Gotas de néctar -->
  <circle cx="136" cy="70" r="2.6" fill="#F5C842" />
  <circle cx="190" cy="64" r="2.2" fill="#F5C842" />
  <circle cx="212" cy="84" r="2.4" fill="#FFE8A3" />
</svg>
