    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;

        display: grid;
        place-items: center;
        padding: 24px;
        font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
        color: #f7f4e8;
        background: radial-gradient(circle at top right, rgba(200, 244, 81, 0.12), transparent 45%), #0b2119;

        padding: 4px 12px;

        font-size: 13px;
        font-weight: 600;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.65rem, 4vw, 2.2rem);
        line-height: 1.15;
        color: #c8f451;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.6;
        color: #d5e2d2;
      }
      nav {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      a {
        padding: 11px 18px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
      }
      .primary {
        color: #0b2119;
        background: #c8f451;
