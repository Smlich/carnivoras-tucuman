[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  VITE_STATIC_PREVIEW = "false"

[[redirects]]
  from = "/catalogo"
  to = "/catalogo.html"
  status = 301
  force = true

[[redirects]]
  from = "/vivero"
  to = "/vivero.html"
  status = 301
  force = true

